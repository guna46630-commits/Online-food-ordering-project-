<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Online Food Ordering Website</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar, menu grid on the left, order panel on the right (full-screen sheet on phones). */
:root {
  --bg: #F1F5F0;
  --surface: #FFFFFF;
  --surface-2: #E6ECE5;
  --fg: #14211B;
  --muted: #55665C;
  --line: #D3DCD1;
  --accent: #D2381C;
  --accent-fg: #FFFFFF;
  --veg: #1E8E3E;
  --nonveg: #B3261E;
  --danger: #B3261E;
  --ok: #1E7A46;
  --tile-s: 78%;
  --tile-l: 89%;
  --font-display: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --hh: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512;
    --surface: #17211C;
    --surface-2: #202D26;
    --fg: #E8F0EA;
    --muted: #96A99D;
    --line: #2C3B33;
    --accent: #FF7358;
    --accent-fg: #1D0903;
    --veg: #4CC27A;
    --nonveg: #FF7B72;
    --danger: #FF8A80;
    --ok: #5FD08C;
    --tile-s: 38%;
    --tile-l: 23%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512;
  --surface: #17211C;
  --surface-2: #202D26;
  --fg: #E8F0EA;
  --muted: #96A99D;
  --line: #2C3B33;
  --accent: #FF7358;
  --accent-fg: #1D0903;
  --veg: #4CC27A;
  --nonveg: #FF7B72;
  --danger: #FF8A80;
  --ok: #5FD08C;
  --tile-s: 38%;
  --tile-l: 23%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--surface);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  width: 100%;
  max-width: 1180px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* top bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { height: var(--hh); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; white-space: nowrap; }
.cart-btn {
  display: inline-flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); background: var(--bg);
  border-radius: 999px; padding: 8px 14px; font-weight: 700;
}
.cart-btn .count {
  min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px;
  background: var(--accent); color: var(--accent-fg);
  display: inline-grid; place-items: center; font-size: 13px; font-family: var(--font-mono);
}
.cart-btn .amt { font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--muted); }

/* page */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 24px 48px; align-items: start; }
.intro h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 5vw, 40px); line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 6px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); }
.intro .fine { font-family: var(--font-mono); font-size: 13px; }

.tools { display: flex; flex-direction: column; gap: 12px; margin-block: 20px 18px; }
.search { position: relative; }
.search input {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface);
}
.search input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip {
  flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.veg-chip { display: inline-flex; align-items: center; gap: 8px; }
.chip.veg-chip[aria-pressed="true"] { background: var(--veg); border-color: var(--veg); color: #fff; }
.count-line { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.tile {
  position: relative; aspect-ratio: 4 / 3; display: grid; place-items: center; font-size: 58px;
  background: hsl(var(--h) var(--tile-s) var(--tile-l));
}
.tile .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .cat {
  z-index: 1;
  position: absolute; left: 10px; top: 10px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; background: var(--surface); color: var(--fg); padding: 3px 8px; border-radius: 999px;
}
.card-body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.name-row { display: flex; align-items: flex-start; gap: 8px; }
.name-row h3 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
.desc { margin: 0; color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.price { font-family: var(--font-mono); font-weight: 500; font-size: 16px; }
.vmark { flex: none; width: 16px; height: 16px; border: 2px solid; border-radius: 3px; display: inline-grid; place-items: center; margin-top: 3px; }
.vmark::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.vmark.v { color: var(--veg); }
.vmark.n { color: var(--nonveg); }

.btn {
  border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700;
  background: var(--accent); color: var(--accent-fg);
}
.btn:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn.wide { width: 100%; padding: 13px 16px; font-size: 15px; }
.btn.add { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); padding: 7px 18px; }
.btn.add:hover { background: var(--accent); color: var(--accent-fg); filter: none; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 13px; }
.link:hover { color: var(--accent); }

.step { display: inline-flex; align-items: center; border: 1.5px solid var(--accent); border-radius: 10px; overflow: hidden; }
.step button { width: 34px; height: 34px; border: 0; background: transparent; color: var(--accent); font-size: 18px; line-height: 1; font-weight: 700; }
.step button:hover { background: var(--accent); color: var(--accent-fg); }
.step output { min-width: 30px; text-align: center; font-family: var(--font-mono); font-weight: 500; }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 32px 20px; text-align: center; color: var(--muted); background: var(--surface); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }

/* order panel */
.cart {
  --pl: 18px; --pr: 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px var(--pr) 12px var(--pl); border-bottom: 1px solid var(--line); }
.p-head h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.p-head h2:focus { outline: none; }
.p-head .x { display: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.p-body { padding: 14px var(--pr) 14px var(--pl); overflow-y: auto; flex: 1; min-height: 0; }
.p-foot { padding: 14px var(--pr) 16px var(--pl); border-top: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 10px; }

.lines { list-style: none; margin: 0; padding: 0; }
.line { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line:first-child { padding-top: 0; }
.l-main { display: flex; gap: 10px; align-items: flex-start; }
.l-name { font-weight: 700; }
.l-unit { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.l-ctl { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.l-sub { font-family: var(--font-mono); font-weight: 500; }
.line .link { justify-self: start; }

.totals { margin: 0; display: grid; gap: 4px; font-size: 14px; }
.totals div { display: flex; justify-content: space-between; gap: 12px; }
.totals dt { color: var(--muted); }
.totals dd { margin: 0; font-family: var(--font-mono); }
.totals .grand { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 17px; }
.totals .grand dt { color: var(--fg); font-weight: 700; }
.totals .grand dd { font-weight: 500; }
.note { margin: 6px 0 0; font-size: 13px; color: var(--ok); }

.sum-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.sum-list li { display: flex; justify-content: space-between; gap: 12px; }
.sum-list .q { font-family: var(--font-mono); color: var(--muted); }
.sum-list .a { font-family: var(--font-mono); white-space: nowrap; }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg); margin-bottom: 16px; }
.box h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

form .f { display: grid; gap: 4px; margin-bottom: 12px; min-width: 0; }
form label, form legend { font-weight: 700; font-size: 13.5px; }
form input[type="text"], form input[type="tel"], form input[type="email"], form textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
}
form textarea { resize: vertical; min-height: 72px; }
form input[aria-invalid="true"], form textarea[aria-invalid="true"] { border-color: var(--danger); }
.err { color: var(--danger); font-size: 12.5px; min-height: 0; margin: 0; }
.row2 { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
fieldset { border: 0; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
.pay { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-weight: 500 !important; }
.pay input { accent-color: var(--accent); }
.back { margin-bottom: 12px; }

.done { text-align: center; padding: 18px 4px; }
.done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok); color: var(--bg); display: grid; place-items: center; margin: 0 auto 12px; font-size: 28px; font-weight: 800; }
.done h3 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
.done p { margin: 0 0 6px; color: var(--muted); }
.done .oid { font-family: var(--font-mono); color: var(--fg); font-size: 18px; }
.done .box { text-align: left; margin-top: 16px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px);
  z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px;
  font-weight: 500; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 560px) { .row2 { grid-template-columns: 1fr 1fr; } }

@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr) 380px; }
  .cart-btn { display: none; }
  .cart {
    position: sticky;
    top: calc(var(--hh) + env(safe-area-inset-top, 0px) + 16px);
    max-height: calc(100dvh - var(--hh) - env(safe-area-inset-top, 0px) - 32px);
  }
}
@media (max-width: 899px) {
  .cart {
    --pl: max(16px, env(safe-area-inset-left, 0px));
    --pr: max(16px, env(safe-area-inset-right, 0px));
    position: fixed; inset: 0; z-index: 50; border: 0; border-radius: 0;
    padding-top: env(safe-area-inset-top, 0px);
    transform: translateY(100%); visibility: hidden;
    transition: transform .25s ease, visibility 0s linear .25s;
  }
  .cart.open { transform: none; visibility: visible; transition: transform .25s ease; }
  .p-head .x { display: inline-block; }
  .p-foot { padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 420px) { .brand small { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .cart, .cart.open, .toast { transition: none; }
}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand">Tiffin Lane <small>Open 11 am to 11 pm</small></div>
    <button class="cart-btn" id="cartBtn" type="button" aria-controls="cartPanel" aria-expanded="false">
      <span>Cart</span><span class="count" id="cartCount">0</span><span class="amt" id="cartAmt">₹0</span>
    </button>
  </div>
</header>

<main class="wrap layout">
  <section aria-labelledby="menuTitle">
    <div class="intro">
      <h1 id="menuTitle">Today's menu</h1>
      <p class="fine">35–40 min delivery · free above ₹500 · 5% GST added at checkout</p>
    </div>

    <div class="tools">
      <div class="search">
        <label class="sr" for="q">Search dishes by name</label>
        <input id="q" type="search" placeholder="Search dishes, e.g. biryani" autocomplete="off">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    </div>

    <p class="count-line" id="countLine" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="cart" id="cartPanel" aria-label="Your order"></aside>
</main>

    var nm = esc(it.name);
    return '<div class="step" role="group" aria-label="Quantity of ' + nm + '">' +
      '<button type="button" data-act="dec" data-id="' + it.id + '" aria-label="Remove one ' + nm + '">−</button>' +
      '<output aria-live="polite">' + n + '</output>' +
      '<button type="button" data-act="inc" data-id="' + it.id + '" aria-label="Add one ' + nm + '"' + (n >= MAXQ ? ' disabled' : '') + '>+</button></div>';
  }
  function cardAction(it) {
    var n = cart[it.id] || 0;
    return n ? stepper(it, n) : '<button class="btn add" type="button" data-act="add" data-id="' + it.id + '" aria-label="Add ' + esc(it.name) + ' to cart">Add</button>';
  }
  function filtered() {
    var q = query.trim().toLowerCase();
    return MENU.filter(function (m) {
      return (cat === 'All' || m.cat === cat) && (!vegOnly || m.veg) && (!q || m.name.toLowerCase().indexOf(q) !== -1);
    });
  }
  function renderChips() {
    var h = CATS.map(function (c) { return '<button class="chip" type="button" data-cat="' + esc(c) + '" aria-pressed="' + (c === cat) + '">' + esc(c) + '</button>'; }).join('');
    h += '<button class="chip veg-chip" type="button" id="vegChip" aria-pressed="' + vegOnly + '"><span class="vmark v" aria-hidden="true"></span>Veg only</button>';
    $('#chips').innerHTML = h;
  }
  function renderMenu() {
    var list = filtered();
    $('#countLine').textContent = list.length + (list.length === 1 ? ' dish' : ' dishes') + (cat !== 'All' ? ' in ' + cat : '') + (query.trim() ? ' matching "' + query.trim() + '"' : '');
    if (!list.length) {
      $('#grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><strong>No dishes found</strong>Try a different name, or clear the filters to see the full menu.<br><button class="btn" type="button" data-act="reset">Clear filters</button></div>';
      return;
    }
    $('#grid').innerHTML = list.map(function (m) {
      return '<article class="card" data-card="' + m.id + '">' +
        '<div class="tile" style="--h:' + HUES[m.cat] + '" role="img" aria-label="' + esc(m.name) + '"><span class="cat">' + esc(m.cat) + '</span><span aria-hidden="true">' + m.emoji + '</span>' + (imgSrc(m) ? '<img class="photo" src="' + imgSrc(m) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
        '<div class="card-body"><div class="name-row"><span class="vmark ' + (m.veg ? 'v' : 'n') + '" role="img" aria-label="' + (m.veg ? 'Vegetarian' : 'Non-vegetarian') + '"></span><h3>' + esc(m.name) + '</h3></div>' +
        '<p class="desc">' + esc(m.desc) + '</p>' +
        '<div class="foot"><span class="price">' + inr(m.price) + '</span><span class="act">' + cardAction(m) + '</span></div></div></article>';
    }).join('');
  }
  function updateCard(id) {
    var c = document.querySelector('[data-card="' + id + '"] .act');
    if (c) c.innerHTML = cardAction(byId[id]);
  }

  /* ---------- Cart changes ---------- */
  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function setQty(id, n, act, scope) {
    n = Math.max(0, Math.min(MAXQ, n));
    var had = cart[id] || 0;
    if (n === 0) delete cart[id]; else cart[id] = n;
    saveCart();
    if (view === 'done') view = 'cart';
    updateCard(id);
    refreshCartUI();
    if (!had && n) toast(byId[id].name + ' added to cart');
    if (had && !n) toast(byId[id].name + ' removed');
    if (act && scope) {
      var el = document.querySelector(scope + ' [data-act="' + act + '"][data-id="' + id + '"]');
      if (el && !el.disabled) el.focus({ preventScroll: true });
    }
  }
  function refreshCartUI() {
    var t = totals();
    $('#cartCount').textContent = t.count;
    $('#cartAmt').textContent = inr(t.total);
    $('#cartBtn').setAttribute('aria-label', 'Open cart, ' + t.count + ' items, ' + inr(t.total));
    if (view === 'checkout' && t.count === 0) view = 'cart';
    if (view === 'checkout') { renderSummary(); renderFoot(); }
    else renderPanel();
  }

  /* ---------- Panel ---------- */
  function panelShell(title, body, foot) {
    $('#cartPanel').innerHTML =
      '<div class="p-head"><h2 id="panelTitle" tabindex="-1">' + title + '</h2><button class="x" type="button" data-act="close">Close</button></div>' +
      '<div class="p-body" id="pBody">' + body + '</div>' +
      '<div class="p-foot" id="pFoot"' + (foot ? '' : ' hidden') + '>' + (foot || '') + '</div>';
  }
  function linesHTML() {
    return '<ul class="lines">' + Object.keys(cart).map(function (id) {
      var it = byId[id], n = cart[id];
      return '<li class="line"><div class="l-main"><span class="vmark ' + (it.veg ? 'v' : 'n') + '" aria-hidden="true"></span><div><div class="l-name">' + esc(it.name) + '</div><div class="l-unit">' + inr(it.price) + ' each</div></div></div>' +
        '<div class="l-ctl">' + stepper(it, n) + '<span class="l-sub">' + inr(it.price * n) + '</span></div>' +
        '<button class="link" type="button" data-act="rm" data-id="' + id + '">Remove ' + esc(it.name) + '</button></li>';
    }).join('') + '</ul>';
  }
  function renderPanel() {
    var t = totals();
    if (view === 'cart') {
      if (!t.count) {
        panelShell('Your order', '<div class="empty"><strong>Your cart is empty</strong>Add a few dishes from the menu and they will show up here.<br><button class="btn" type="button" data-act="close-mobile">Browse the menu</button></div>', '');
      } else {
        panelShell('Your order <span class="l-unit">(' + t.count + (t.count === 1 ? ' item' : ' items') + ')</span>', linesHTML() + '<div style="margin-top:14px">' + totalsHTML(t) + '</div>',
          '<button class="btn wide" type="button" data-act="checkout">Review order · ' + inr(t.total) + '</button>');
      }
    } else if (view === 'checkout') {
      panelShell('Review & checkout', checkoutHTML(), footCheckout(t));
      renderSummary();
    } else if (view === 'done' && lastOrder) {
      var o = lastOrder;
      panelShell('Order placed',
        '<div class="done"><div class="tick" aria-hidden="true">✓</div><h3>Thank you, ' + esc(o.name.split(' ')[0]) + '</h3>' +
        '<p>Your order is confirmed and the kitchen has started.</p><p class="oid">' + o.id + '</p><p>Arriving in about 35–40 minutes. Pay ' + inr(o.total) + ' on delivery by ' + esc(o.payLabel) + '.</p>' +
        '<div class="box"><h3>What you ordered</h3><ul class="sum-list" style="margin:0">' + o.items.map(function (i) { return '<li><span>' + esc(i.name) + ' <span class="q">× ' + i.qty + '</span></span><span class="a">' + inr(i.line) + '</span></li>'; }).join('') + '</ul></div>' +
        '<div class="box"><h3>Delivering to</h3><div>' + esc(o.name) + '<br>' + esc(o.address) + ' ' + esc(o.pin) + '<br>' + esc(o.phone) + '</div></div></div>',
        '<button class="btn wide" type="button" data-act="again">Order something else</button>');
    }
  }
  function footCheckout(t) {
    return totalsHTMLCompact(t) + '<button class="btn wide" type="submit" form="checkoutForm">Place order · ' + inr(t.total) + '</button>';
  }
  function totalsHTMLCompact(t) {
    return '<dl class="totals"><div class="grand" style="margin:0;padding:0;border:0"><dt>Order total</dt><dd>' + inr(t.total) + '</dd></div></dl>';
  }
  function renderFoot() {
    var f = $('#pFoot'); if (f) f.innerHTML = footCheckout(totals());
  }
  function renderSummary() {
    var box = $('#sumBox'); if (!box) return;
    var t = totals();
    box.innerHTML = '<ul class="sum-list">' + Object.keys(cart).map(function (id) {
      var it = byId[id], n = cart[id];
      return '<li><span>' + esc(it.name) + ' <span class="q">× ' + n + ' @ ' + inr(it.price) + '</span></span><span class="a">' + inr(it.price * n) + '</span></li>';
    }).join('') + '</ul>' + totalsHTML(t);
  }
  function checkoutHTML() {
    function f(id, label, type, extra, attrs) {
      return '<div class="f"><label for="f-' + id + '">' + label + '</label><input id="f-' + id + '" name="' + id + '" type="' + type + '" value="' + esc(cust[id]) + '" ' + (attrs || '') + ' aria-describedby="e-' + id + '"><p class="err" id="e-' + id + '"></p></div>';
    }
    return '<button class="link back" type="button" data-act="back">← Back to cart</button>' +
      '<div class="box"><h3>Order summary</h3><div id="sumBox"></div></div>' +
      '<form id="checkoutForm" novalidate>' +
      f('name', 'Full name', 'text', '', 'autocomplete="name"') +
      '<div class="row2">' + f('phone', 'Mobile number', 'tel', '', 'autocomplete="tel-national" inputmode="numeric" maxlength="14" placeholder="98765 43210"') +
      f('pin', 'PIN code', 'text', '', 'autocomplete="postal-code" inputmode="numeric" maxlength="6" placeholder="600001"') + '</div>' +
      f('email', 'Email', 'email', '', 'autocomplete="email" placeholder="name@example.com"') +
      '<div class="f"><label for="f-address">Delivery address</label><textarea id="f-address" name="address" autocomplete="street-address" aria-describedby="e-address" placeholder="House no., street, area, landmark">' + esc(cust.address) + '</textarea><p class="err" id="e-address"></p></div>' +
      '<fieldset><legend>Payment on delivery</legend>' +
      [['cod', 'Cash'], ['upi', 'UPI'], ['card', 'Card']].map(function (p) {
        return '<label class="pay"><input type="radio" name="pay" value="' + p[0] + '"' + (cust.pay === p[0] ? ' checked' : '') + '>' + p[1] + '</label>';
      }).join('') + '</fieldset>' +
      '<div class="f"><label for="f-notes">Note for the kitchen <span class="l-unit">(optional)</span></label><textarea id="f-notes" name="notes" placeholder="Less spicy, no onions, ring the bell">' + esc(cust.notes) + '</textarea></div>' +
      '<p class="err" id="e-form" role="alert"></p></form>';
  }

  /* ---------- Validation ---------- */
  var rules = {
    name: function (v) { v = v.trim(); if (!v) return 'Enter your full name.'; if (v.length < 2 || !/^[A-Za-z][A-Za-z .'-]*$/.test(v)) return 'Use letters only, at least 2 characters.'; return ''; },
    phone: function (v) { v = v.replace(/[\s-]/g, ''); if (!v) return 'Enter your mobile number.'; if (!/^[6-9]\d{9}$/.test(v)) return 'Enter a 10-digit mobile number starting with 6 to 9.'; return ''; },
    pin: function (v) { v = v.trim(); if (!v) return 'Enter your PIN code.'; if (!/^[1-9]\d{5}$/.test(v)) return 'PIN code must be 6 digits.'; return ''; },
    email: function (v) { v = v.trim(); if (!v) return 'Enter your email address.'; if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Enter a valid email like name@example.com.'; return ''; },
    address: function (v) { v = v.trim(); if (!v) return 'Enter your delivery address.'; if (v.length < 10) return 'Add more detail: house number, street and area.'; return ''; }
  };
  var ORDER = ['name', 'phone', 'pin', 'email', 'address'];
  function showErr(field, msg) {
    var inp = $('#f-' + field), e = $('#e-' + field);
    if (!inp || !e) return;
    e.textContent = msg;
    if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
  }
  function validateField(field) { var m = rules[field](cust[field]); showErr(field, m); return m; }

  function submitOrder(ev) {
    ev.preventDefault();
    var formErr = $('#e-form'); formErr.textContent = '';
    var t = totals();
    if (!t.count) { formErr.textContent = 'Your cart is empty. Add at least one dish before placing an order.'; return; }
    var first = null;
    ORDER.forEach(function (f) { if (validateField(f) && !first) first = f; });
    if (!['cod', 'upi', 'card'].includes(cust.pay)) { formErr.textContent = 'Choose how you will pay on delivery.'; return; }
    if (first) { var el = $('#f-' + first); if (el) el.focus(); formErr.textContent = 'Please fix the highlighted fields and try again.'; return; }
    var items = Object.keys(cart).map(function (id) { return { name: byId[id].name, qty: cart[id], line: byId[id].price * cart[id] }; });
    lastOrder = {
      id: 'TL-' + String(Math.floor(10000 + Math.random() * 90000)),
      name: cust.name.trim(), phone: cust.phone.replace(/[\s-]/g, ''), address: cust.address.trim(), pin: cust.pin.trim(),
      payLabel: { cod: 'cash', upi: 'UPI', card: 'card' }[cust.pay], total: t.total, items: items
    };
    cart = {}; saveCart();
    cust.notes = '';
    view = 'done';
    renderMenu(); refreshCartUI();
    go('done');
    toast('Order ' + lastOrder.id + ' placed');
  }

  /* ---------- Navigation ---------- */
  function go(v) {
    view = v; renderPanel();
    var h = $('#panelTitle'); if (h) h.focus({ preventScroll: true });
    var b = $('#pBody'); if (b) b.scrollTop = 0;
  }
  function openCart() { $('#cartPanel').classList.add('open'); $('#cartBtn').setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; var h = $('#panelTitle'); if (h) h.focus({ preventScroll: true }); }
  function closeCart() { $('#cartPanel').classList.remove('open'); $('#cartBtn').setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }
  var mq = window.matchMedia('(min-width: 900px)');
  mq.addEventListener('change', function () { if (mq.matches) closeCart(); });

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-cat]');
    if (chip) { cat = chip.getAttribute('data-cat'); renderChips(); renderMenu(); return; }
    if (e.target.closest('#vegChip')) { vegOnly = !vegOnly; renderChips(); renderMenu(); return; }
    if (e.target.closest('#cartBtn')) { openCart(); return; }
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    var scope = b.closest('#cartPanel') ? '#cartPanel' : '#grid';
    if (act === 'add') setQty(id, 1, 'inc', scope);
    else if (act === 'inc') setQty(id, (cart[id] || 0) + 1, 'inc', scope);
    else if (act === 'dec') setQty(id, (cart[id] || 0) - 1, (cart[id] || 0) > 1 ? 'dec' : 'add', scope);
    else if (act === 'rm') setQty(id, 0);
    else if (act === 'checkout') go('checkout');
    else if (act === 'back') go('cart');
    else if (act === 'again') { go('cart'); closeCart(); }
    else if (act === 'close' || act === 'close-mobile') closeCart();
    else if (act === 'reset') { cat = 'All'; vegOnly = false; query = ''; $('#q').value = ''; renderChips(); renderMenu(); }
  });
  $('#q').addEventListener('input', function (e) { query = e.target.value; renderMenu(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCart(); });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.closest || !t.closest('#checkoutForm')) return;
    if (t.name === 'pay') { cust.pay = t.value; return; }
    if (!(t.name in cust)) return;
    cust[t.name] = t.value;
    if (rules[t.name] && t.getAttribute('aria-invalid') === 'true') validateField(t.name);
  });
  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t.closest && t.closest('#checkoutForm') && rules[t.name] && cust[t.name]) validateField(t.name);
  });
  document.addEventListener('submit', function (e) { if (e.target.id === 'checkoutForm') submitOrder(e); });

  /* ---------- Boot ---------- */
  loadCart();
  renderChips();
  renderMenu();
  refreshCartUI();
})();
</script>

</body></html>
